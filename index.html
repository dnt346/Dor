
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .romance-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffe0ec 0%, #ffc6d9 50%, #ffb3cc 100%);

  }
  .petals-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .petal { position: absolute; animation: fall linear infinite; opacity: 0.75; user-select: none; pointer-events: none; }
  @keyframes fall {
    0%   { transform: translateY(-60px) rotate(0deg); opacity: 0.85; }
    100% { transform: translateY(110vh) rotate(400deg); opacity: 0; }
  }
  .sparkle { position: absolute; border-radius: 50%; animation: twinkle ease-in-out infinite; opacity: 0; pointer-events: none; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 1; transform: scale(1.5); }
  }
  .card {
    background: white;
    border-radius: 28px;
    padding: 2.5rem 2rem 2rem;
    max-width: 380px;
    width: 100%;
    text-align: center;

  .music-btn {
    position: fixed; top: 18px; right: 18px; z-index: 300;

  .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }

    display: inline-block; width: 3px; background: #d63670; border-radius: 2px;

  .music-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .music-bars span:nth-child(2) { height: 12px; animation-delay: 0.15s; }

  .main-screen { display: flex; flex-direction: column; align-items: center; }
  .success-screen { display: none; flex-direction: column; align-items: center; gap: 0.6rem; }
  .success-screen.show { display: flex; }

  .success-msg { font-size: 0.9rem; color: #a05070; max-width: 260px; line-height: 1.6; }

    margin-top: 0.8rem; padding: 13px 32px; background: #25D366; color: white;

    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>

<script>
const nomorWA = "6285278066109";
const pesanJawaban = "Iyaaa, aku mau jadi BF kamu! 🥰❤️";

let audioCtx = null;
let musicPlaying = false;
let loopTimeout = null;
let startedOnce = false;

// ==== MELODI: A Thousand Years style (C major, romantic waltz feel) ====
// Format: [frekuensi, durasi_detik]
const song = [
  // Intro arpeggio
  [523,0.2],[659,0.2],[784,0.2],[1047,0.4],
  [988,0.2],[784,0.2],[659,0.4],
  [523,0.2],[659,0.2],[784,0.2],[1047,0.4],
  [988,0.4],[784,0.4],

  // Melodi utama - baris 1
  [784,0.4],[880,0.2],[784,0.2],[698,0.4],[784,0.2],[698,0.2],
  [659,0.6],[587,0.2],[523,0.4],
  [587,0.4],[659,0.2],[587,0.2],[523,0.4],[587,0.2],[523,0.2],
  [494,0.8],[494,0.4],

  // Melodi utama - baris 2 (naik)
  [784,0.4],[880,0.2],[784,0.2],[988,0.4],[880,0.2],[784,0.2],
  [1047,0.6],[988,0.2],[880,0.4],
  [784,0.4],[880,0.2],[784,0.2],[698,0.4],[659,0.2],[587,0.2],
  [523,0.8],[523,0.4],

  // Bridge romantis
  [659,0.3],[784,0.3],[880,0.3],[988,0.3],[1047,0.6],
  [988,0.3],[880,0.3],[784,0.3],[698,0.3],[659,0.6],
  [587,0.3],[659,0.3],[784,0.3],[880,0.3],[988,0.6],
  [880,0.3],[784,0.3],[659,0.3],[523,0.3],[523,0.6],

  // Chorus (lebih semangat)
  [1047,0.3],[988,0.3],[880,0.3],[784,0.3],[880,0.6],
  [988,0.3],[1047,0.3],[988,0.3],[880,0.3],[784,0.6],
  [784,0.3],[880,0.3],[988,0.3],[1047,0.3],[1175,0.6],
  [1047,0.4],[988,0.4],[880,0.4],[784,0.8],

  // Outro (turun lembut)
  [784,0.3],[698,0.3],[659,0.3],[587,0.3],[523,0.6],
  [587,0.3],[659,0.3],[784,0.3],[659,0.3],[523,0.6],
  [523,0.8],[523,1.0],
];

// Chord backing (akord bawah untuk kedalaman)
const chords = [
  [[262,330,392], 2.4],
  [[247,311,370], 2.4],
  [[220,277,349], 2.4],
  [[196,262,330], 2.4],
];

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playNote(freq, startTime, dur, vol, type) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + 0.03);
  gain.gain.setValueAtTime(vol * 0.8, startTime + dur * 0.6);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur * 0.98);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + dur);
}

function playChord(freqs, startTime, dur) {
  freqs.forEach(f => playNote(f, startTime, dur, 0.05, 'triangle'));
}

function playSong() {
  const ctx = getCtx();
  let t = ctx.currentTime + 0.1;
  let totalDur = 0;

  // Backing chords loop
  const chordDur = song.reduce((s, n) => s + n[1], 0);
  let ct = ctx.currentTime + 0.1;
  let ci = 0;
  for (let elapsed = 0; elapsed < chordDur; elapsed += chords[ci % chords.length][1]) {
    const [cfreqs, cdur] = chords[ci % chords.length];
    playChord(cfreqs, ct + elapsed, cdur * 0.9);
    ci++;
  }

  // Melodi utama (sine + overtone)
  song.forEach(([freq, dur]) => {
    playNote(freq, t, dur, 0.18, 'sine');
    playNote(freq * 2, t, dur * 0.5, 0.04, 'triangle');
    t += dur;
  });

  totalDur = t - ctx.currentTime;
  return totalDur * 1000;
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  startedOnce = true;
  document.getElementById('musicLabel').textContent = 'Pause';
  document.getElementById('musicBars').classList.remove('paused');
  hideTapHint();

  function loop() {
    const dur = playSong();
    loopTimeout = setTimeout(loop, dur - 300);
  }
  loop();
}

function stopMusic() {
  musicPlaying = false;
  if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
  document.getElementById('musicLabel').textContent = 'Play Musik';
  document.getElementById('musicBars').classList.add('paused');
}

function toggleMusic() {
  if (!musicPlaying) startMusic(); else stopMusic();
}

function hideTapHint() {
  const h = document.getElementById('tapHint');
  if (h) { h.style.opacity = '0'; h.style.transition = 'opacity 0.4s'; setTimeout(() => h.remove(), 400); }
}

// Auto-play: coba langsung, fallback ke tap pertama
function tryAutoPlay() {
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') {
      ctx.resume().then(() => startMusic()).catch(() => {});
    } else {
      startMusic();
    }
  } catch(e) {}
}

// Fallback: mulai musik saat user pertama kali tap/klik di mana saja
function onFirstInteraction() {
  if (!startedOnce) {
    startMusic();
  }
  document.removeEventListener('click', onFirstInteraction);
  document.removeEventListener('touchstart', onFirstInteraction);
}
document.addEventListener('click', onFirstInteraction);
document.addEventListener('touchstart', onFirstInteraction);

window.addEventListener('load', () => {
  setTimeout(tryAutoPlay, 300);
  positionBtnNo();
});

// ==== Petals & sparkles ====
const petalSymbols = ['🌸','🌺','🌹','💮','✨','💫','🌟','🎀','💕'];
const petalsEl = document.getElementById('petals');

function spawnPetal() {
  const el = document.createElement('div');
  el.className = 'petal';
  el.textContent = petalSymbols[Math.floor(Math.random() * petalSymbols.length)];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.top = '-40px';
  el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
  el.style.animationDuration = (5 + Math.random() * 6) + 's';
  petalsEl.appendChild(el);
  setTimeout(() => el.remove(), 13000);
}
setInterval(spawnPetal, 700);
for (let i = 0; i < 10; i++) setTimeout(spawnPetal, i * 150);

function spawnSparkle() {
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  const sz = 4 + Math.random() * 7;
  s.style.width = s.style.height = sz + 'px';
  s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
  s.style.animationDelay = (Math.random() * 2) + 's';
  s.style.background = ['#ff6b9d','#ff4d6d','#ffd6e8','#ffb3cc','#fff'][Math.floor(Math.random()*5)];
  petalsEl.appendChild(s);
  setTimeout(() => s.remove(), 5000);
}
setInterval(spawnSparkle, 350);

// ==== Tombol Enggak ====
const btnNo = document.getElementById('btnNo');

function positionBtnNo() {
  const bw = btnNo.offsetWidth || 110;
  const bh = btnNo.offsetHeight || 46;
  btnNo.style.left = ((window.innerWidth - bw) / 2) + 'px';
  btnNo.style.top  = ((window.innerHeight - bh) / 2 + 44) + 'px';
}
window.addEventListener('resize', positionBtnNo);

function runAway() {
  const margin = 24;
  const bw = btnNo.offsetWidth || 110;
  const bh = btnNo.offsetHeight || 46;
  const x = margin + Math.random() * (window.innerWidth - bw - margin * 2);
  const y = margin + Math.random() * (window.innerHeight - bh - margin * 2);
  btnNo.style.transition = 'left 0.22s cubic-bezier(.34,1.56,.64,1), top 0.22s cubic-bezier(.34,1.56,.64,1)';
  btnNo.style.left = x + 'px';
  btnNo.style.top  = y + 'px';
}

// ==== Confetti ====
function launchConfetti(ox, oy) {
  const colors = ['#ff4d6d','#ff9ab8','#d63670','#ffd6e8','#ff6b9d','#ff1a4e','#ffffff','#ffb3cc'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (ox + (Math.random() - 0.5) * 160) + 'px';
    el.style.top  = (oy + (Math.random() - 0.5) * 40) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const sz = 5 + Math.random() * 9;
    el.style.width = sz + 'px'; el.style.height = sz + 'px';
    el.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }
}

function playCelebration() {
  const ctx = getCtx();
  const fanfare = [[523,0.15],[659,0.15],[784,0.15],[1047,0.25],[1047,0.1],[1175,0.1],[1047,0.35]];
  let t = ctx.currentTime + 0.05;
  fanfare.forEach(([freq, dur]) => {
    playNote(freq, t, dur, 0.22, 'sine');
    playNote(freq * 1.5, t, dur * 0.6, 0.06, 'triangle');
    t += dur;
  });
}

function handleYes() {
  const btn = document.getElementById('btnYes');
  const rect = btn.getBoundingClientRect();
  playCelebration();
  launchConfetti(rect.left + rect.width / 2, rect.top);
  btnNo.style.display = 'none';
  setTimeout(() => {
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
    launchConfetti(window.innerWidth / 2, window.innerHeight / 3);
  }, 600);
}

function kirimWA() {
  const url = `https://api.whatsapp.com/send?phone=${nomorWA}&text=${encodeURIComponent(pesanJawaban)}`;
  window.open(url, '_blank');
}
</script>
